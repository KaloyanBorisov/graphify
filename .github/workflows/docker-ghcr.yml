name: Build & publish image to GHCR

# Builds this fork's v8 branch with the repo's own Dockerfile and publishes
# ghcr.io/<owner>/graphify. Triggered by pushes to v8, which includes clicking
# "Sync fork" on GitHub or running `gh repo sync` to pull in upstream
# Graphify-Labs/graphify changes, plus any patch committed to this fork.

on:
  push:
    branches: [v8]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "worked/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this commit is already published"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version and image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="$(grep -m1 -E '^version\s*=' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          sha="$(git rev-parse --short=8 HEAD)"
          echo "image=ghcr.io/${owner}/graphify" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "full_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building ${{ github.repository }} @ ${sha} (version ${version})"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this commit is already published
        id: check
        run: |
          if [ "${{ inputs.force }}" != "true" ] && \
             docker manifest inspect "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "sha-${{ steps.meta.outputs.sha }} already published, nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.title=graphify
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.description=Graphify MCP server built from ${{ github.repository }}@${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max